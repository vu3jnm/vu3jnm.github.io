<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f47721">
  <title>Mantra Repetition Counter</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #302116;
      background: #f47721;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: linear-gradient(145deg, #ff9b42 0%, #f47721 52%, #e85b18 100%);
    }
    main {
      width: min(100%, 440px);
      padding: clamp(30px, 7vw, 52px);
      border: 1px solid rgba(255,255,255,.56);
      border-radius: 24px;
      background: #fffaf4;
      box-shadow: 0 24px 70px rgba(94, 42, 9, .2);
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; letter-spacing: -.055em; }
    h1 { margin-bottom: 28px; }
    textarea {
      display: block;
      width: 100%;
      min-height: 110px;
      margin: 0 0 28px;
      padding: 14px 16px;
      border: 1.5px solid #ead9ca;
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: #302116;
      font: inherit;
      line-height: 1.5;
      resize: vertical;
      text-align: left;
      transition: border-color .18s, box-shadow .18s;
    }
    textarea::placeholder { color: #b5a69b; }
    textarea:focus { border-color: #e86b24; box-shadow: 0 0 0 4px rgba(232,107,36,.14); }
    #value {
      margin: 0 0 30px;
      color: #b65219;
      font-size: clamp(5rem, 22vw, 8rem);
      font-weight: 750;
      letter-spacing: -.07em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .controls { display: flex; justify-content: center; align-items: center; gap: 12px; }
    button {
      min-width: 58px;
      min-height: 52px;
      padding: 10px 18px;
      border: 0;
      border-radius: 14px;
      background: #302116;
      color: #fffaf4;
      font: inherit;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }
    button:hover { background: #59351f; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #e86b24; outline-offset: 3px; }
    #reset { min-width: auto; padding-inline: 20px; font-size: .9rem; }
    @media (max-width: 390px) { .controls { gap: 8px; } button { min-width: 52px; padding-inline: 14px; } #reset { padding-inline: 15px; } }
  </style>
</head>
<body>
  <main>
    <h1>Mantra Repetition Counter</h1>
    <textarea id="notes" aria-label="Text box" placeholder="Type something here…"></textarea>
    <p id="value" aria-live="polite" aria-atomic="true">0</p>
    <div class="controls">
      <button id="minus" type="button" aria-label="Decrease counter">−</button>
      <button id="reset" type="button">Reset</button>
      <button id="plus" type="button" aria-label="Increase counter">+</button>
    </div>
  </main>
  <script>
    let counter = 0;
    const value = document.querySelector('#value');

    function render() {
      value.textContent = counter;
    }

    document.querySelector('#plus').addEventListener('click', () => {
      counter += 1;
      render();
    });
    document.querySelector('#minus').addEventListener('click', () => {
      counter -= 1;
      render();
    });
    document.querySelector('#reset').addEventListener('click', () => {
      counter = 0;
      render();
    });
  </script>
</body>
</html>

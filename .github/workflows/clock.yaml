name: Calculate Sunrise and Sunset Times

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install -r requirements.txt 

      - name: Calculate Sunrise and Sunset Times
        run: python sunrise_sunset.py
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add callsign.html
         
          # Only commit and push if the file actually changed to avoid workflow errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update clock.html" && git push)